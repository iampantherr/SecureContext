name: Publish to npm

# Publishes the package when a version tag is pushed (v0.47.0, …).
# Requires the NPM_TOKEN repository secret (npm automation token with publish
# rights for the "securecontext" package). Provenance links the published
# tarball to this exact workflow run and commit.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm --provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"; exit 1
          fi
      # Without the NPM_TOKEN secret, publishing is impossible — skip with a
      # warning instead of failing the whole workflow (the release tag itself
      # is still valid). Add the secret to enable real publishing.
      - name: Detect npm token
        id: npm_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret not set — skipping npm publish for this tag"
          fi
      - run: npm publish --provenance --access public
        if: steps.npm_token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
